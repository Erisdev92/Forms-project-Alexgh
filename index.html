<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form project Alejandro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body class="bg-light">
    <div class="container p-3 p-md-4">
        <div class="card">

            <!-- Header card -->
            <h1 class="card-header text-center text-md-start">
                Payment form example
            </h1>

            <div class="card-body">

                <!-- boton de alerta -->
                <div class="alert alert-danger" role="alert text-alert text-danger-emphasis">
                    Some fields are missing
                </div>

                <form>

                    <!-- Detalles de la tarjeta de credito -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-5 mb-3 mb-md-0">
                            <label class="form-label">Card #</label>
                            <input type="text" class="form-control" placeholder="XXXXXXXXXXXXXXXX">
                        </div>

                        <div class="col-12 col-md-3 mb-3 mb-md-0">
                            <label class="form-label">CVC #</label>
                            <input type="text" class="form-control" placeholder="0000">
                        </div>

                        <div class="col-12 col-md-4">
                            <label class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="text" class="form-control" placeholder="Amount">
                            </div>
                        </div>
                    </div>

                    <!-- Nombre -->
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>

                    <!-- Calle -->
                    <div class="row mb-4">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="col-12 col-md-3 mb-3 mb-md-0">
                            <label class="form-label">State</label>
                            <select class="form-select">
                                <option selected>Pick a state</option>
                                <option>España</option>
                                <option>Francia</option>
                                <option>Italia</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-3">
                            <label class="form-label">Postal Code</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>

                    <!-- Radiobutton tarjetas de credito + textarea -->
                    <div class="row align-items-start mb-4">

                        <!-- Botones de tarjeta de credito -->
                        <div class="col-12 col-lg-6 mb-3 mb-lg-0">
                            <label class="form-label">We accept:</label>

                            <div class="mt-2">
                                <div class="d-inline-flex bg-secondary p-2 rounded align-items-center gap-4">
                                    <div class="form-check m-0 d-flex align-items-center gap-2">
                                        <input class="form-check-input m-0" type="radio" name="payment">
                                        <i class="fa-brands fa-cc-mastercard text-white fs-4"></i>
                                    </div>

                                    <div class="form-check m-0 d-flex align-items-center gap-2">
                                        <input class="form-check-input m-0" type="radio" name="payment">
                                        <i class="fa-brands fa-cc-visa text-white fs-4"></i>
                                    </div>

                                    <div class="form-check m-0 d-flex align-items-center gap-2">
                                        <input class="form-check-input m-0" type="radio" name="payment">
                                        <i class="fa-brands fa-cc-paypal text-white fs-4"></i>
                                    </div>

                                    <div class="form-check m-0 d-flex align-items-center gap-2">
                                        <input class="form-check-input m-0" type="radio" name="payment">
                                        <i class="fa-solid fa-money-bill-transfer text-white fs-4"></i>
                                    </div>
                                </div>
                            </div>

                            <span class="text-muted invisible">Add any notes here.</span>
                        </div>

                        <!-- Textarea -->
                        <div class="col-12 col-lg-6">
                            <label class="form-label">Message</label>

                            <div class="mt-2">
                                <textarea class="form-control" rows="4"></textarea>
                                <span class="text-muted">Add any notes here.</span>
                            </div>
                        </div>
                    </div>

                </form>
            </div>

            <!-- Botones colocados a la derecha-->
            <div class="card-footer d-flex flex-column flex-md-row justify-content-end gap-2">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Send</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
